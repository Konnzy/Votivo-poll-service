server:
  shutdown: graceful
  port: ${SERVER_PORT:8082}
  error:
    include-message: never
    include-stacktrace: never
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: votivo-poll-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/polls}
    username: ${DB_USERNAME:poll}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # The relay waits for the broker confirm and for a returned (unroutable) message.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/votivo}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/votivo/protocol/openid-connect/certs}
app:
  security:
    audience: ${KEYCLOAK_AUDIENCE:poll-service}
    # Shared with the gateway (frontend). When set, every /api call must carry it in X-Internal-Auth.
    internal-secret: ${INTERNAL_AUTH_SECRET:}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      interval: ${OUTBOX_RELAY_INTERVAL:1s}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
