name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: polls_test
          POSTGRES_USER: poll
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poll -d polls_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: poll
          RABBITMQ_DEFAULT_PASS: test-password
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify Gradle wrapper checksum
        run: sha256sum --check gradle/wrapper/gradle-wrapper.jar.sha256
      - name: Build and test with PostgreSQL and RabbitMQ
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/polls_test
          TEST_DB_USERNAME: poll
          TEST_DB_PASSWORD: test-password
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
          RABBITMQ_USER: poll
          RABBITMQ_PASSWORD: test-password
        run: ./gradlew build postgresTest messagingTest --no-daemon
