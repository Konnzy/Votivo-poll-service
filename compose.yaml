services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: polls
      POSTGRES_USER: ${DB_USERNAME:-poll}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - poll-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-poll}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-poll-local}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5674}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15674}:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 30
  poll-service:
    build: .
    profiles: ["app"]
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/polls
      DB_USERNAME: ${DB_USERNAME:-poll}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8080/realms/votivo}
      KEYCLOAK_JWK_SET_URI: ${CONTAINER_KEYCLOAK_JWK_SET_URI:-http://host.docker.internal:8080/realms/votivo/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-poll-service}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-poll}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-poll-local}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      OUTBOX_RELAY_ENABLED: ${OUTBOX_RELAY_ENABLED:-true}
      OUTBOX_RELAY_INTERVAL: ${OUTBOX_RELAY_INTERVAL:-1s}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
volumes:
  poll-data:
  rabbit-data:
